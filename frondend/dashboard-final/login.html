<!DOCTYPE html>
<html  lang="en" class="overscroll-none">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"  content="width=device-width"  initial-scale="1.0">
        <link  rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    
        <title>Login Page</title>

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    </head>

    <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

        

        <!--login Container-->
        <div class="bg-white  w-full  max-w-md  p-8  rounded-2xl  shadow-xl">

            <h1 class="text-3xl  font-bold  text-center  text-blue-700  mb-2">
                        Welcome Back
            </h1>

            <p class="text-gray-500  text-center  mb-8">Login to your college Dashboard</p>



            <!--Navigation-->
        <nav>
            <a href="index.html"></a>
            <a href="register.html"></a>
        </nav>


            <!--Login Form-->

            <form  id="loginForm">

                <!--email-->
                <div class="mb-5">
                    <label class="black  text-gray-700  font-medium  mb-2">Email</label>
                    <input type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                            class="w-full  border border-gray-300  rounded-lg  px-4  py-3
                                    outline-none  focus:ring-2  focus:ring-blue-500  focus:boder-blue-500">

                </div>

                <!--Password-->
                <div class="mb-6">
                    <label class="block  text-gray-700  font-medium  mb-2">Password</label>
                    <input type="password"
                            id="password"
                            placeholder="Enter Your Password"
                            required
                            class="w-full  border border-gray-300  rounded-lg  px-4  py-3
                                    outline-none  focus:ring-2  focus:ring-blue-500  focus:border-blue-500">

                </div>

                <!--login butto-->
                <button type="submit"
                        class="w-full  bg-blue-600  text-white  py-3  rounded-lg
                                font-semibold  hover:bg-blue-700  transition  duration-300  cursor-pointer">
                        Login
                </button>

            </form>


            <!--Register Link-->
            <p class="text-center  text-gary-600  mt-6">
                New User?
            <a href="register.html"
                class="text-blue-600  font-semibold  hover:underline">
                Register here
            </a>
            </p>

        </div>


    </body>

</html>
