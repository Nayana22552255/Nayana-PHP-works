<!DOCTYPE html>
<html>
    <head>
        <title>Two Column Layout</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>

    <body>
        <h1>My Website</h1>
        <div class="container">

            <!--left column-->
            <div class="text">
                <h2>Welcome to my website</h2>

                <p>HTML is used to create webpages.
                   CSS is used to desgin and style webpages.
                   We can use CSS Flexbox to arrange elements side by side
                </p>

                <p>
                    Responsive design make a website 
                    look good on computers,tables and mobile phones.
                </p>
            </div>

            <!--right column--->
            <div class="image">
                <img src="image.jpg" alt="Webpage image">
            </div>
        </div>
    </body>
</html>
