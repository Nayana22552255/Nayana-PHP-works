<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap Box Pattern</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"        
        rel="stylesheet">               <!--connecting the html page to bootstrap 5.3.3 css library-->
    </head>

    <body>
        <div class="container mt-5">
            <div class="row g-3">
                <div class="col-md-3"> 
                    <div class="bg-primary  text-white p-4 text-center">Box 1</div>
                </div>

                <div class="col-md-3">
                    <div class="bg-success text-white p-4 text-center">Box 2</div>
                </div>

                <div class="col-md-3">
                    <div class="bg-danger text-white p-4 text-center">Box 3</div>
                </div>

                <div class="col-md-3">
                    <div class="bg-warning  p-4 text-center">Box 4</div>
                </div>
            </div>

        </div>
    </body>
</html>
