<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
        <title>Registration Page</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class="bg-slate-100  min-h-screen  flex  items-center  justify-center  p-4">

        <!--Registration container-->
        <div class="bg-white  w-full max-w-md  p-8  rounded-2xl  shadow-xl">

            <h1 class="text-3xl  font-bold  text-center  text-blue-700  mb-2">
                    Create Account
            </h1>

            <p class="text-gray-500  text-center  mb-8">
                Register to access College Dashboard
            </p>

            <!--Registration form-->
            <form  id="registerForm">
                <div class="mb-4">
                    <label class="block  text-gray-700  font-medium mb-2">
                            Name
                    </label>
                    <input type="text"
                            id="name"
                            required
                            placeholder="Enter your name"
                            class="w-full  border-gary-300  rounded-lg  px-4  py-3
                                    outline-none  focus:ring-2  focus:ring-blue-500">

                </div>

                <div  class="mb-4">
                    <label class="block  text-gray-700  font-medium  mb-2">
                            Email
                    </label>
                    <input  type="email"
                            id="email"
                            placeholder="Enter Your Email"
                            required
                            class="w-full  border-gary-300  rounded-lg  px-4 py-3
                                    outline-none   focus:ring-2  focus:ring-blue-500">


                </div>


                <div class="mb-4">
                    <label class="block  text-gray-700  font-medium  mb-2">
                            Role
                    </label>
                    <select  id="role"  required
                            class="w-full  border-gary-300  rounded-lg  px-4  py-3
                                    outline-none  focus:ring-2  focus:ring-blue-500">

                                    <option value="">Select Role</option>
                                    <option value="Admin">Admin</option>
                                    <option value="Teacher">Teacher</option>
                                    <option value="Student">Student</option>

                    </select>

                </div>


                <div class="mb-6">
                    <label class="bloack text-gray-700  font-medium  mb-2">
                            Password
                    </label>
                    <input  type="password"
                            id="password"
                            placeholder="Enter your Password"
                            required
                            minlength="6"
                            maxlength="12"
                            class="w-full  border  border-gray-300  rounded-lg  px-4  py-3
                                    outline-none  focus:ring-2  focus:ring-blue-500">


                </div>

                <div class="flex  gap-4">

                    <button  type="submit"
                            class="flex-1  bg-blue-600  text-white  py-3   rounded-lg
                                    font-semibold  hover:bg-blue-700  transition cursor-pointer">
                            Register
                    </button>

                    <a  href="login.html"
                        class="flex-1  text-center  bg-gray-500  text-white  py-3
                                rounded-lg  font-semibold  hover:bg-gray-600  transition">
                            Cancel
                    </a>

                </div>

            </form>

        </div>

        <!--JavaScript-->
        <script>
            document.getElementById("registerForm").addEventListener("submit", function(event){
                        event.preventDefault();

                        let name=document.getElementById("name").value;
                        let email=document.getElementById("email").value;
                        let role=document.getElementById("role").value;
                        let password=document.getElementById("password").value;

                        //get existing users
                        let users=JSON.parse(localStorage.getItem("users")) || [];

                        //check duplicate email
                        let existingUser=users.find(user => user.email.toLowerCase() === email.trim().toLowerCase());

                        if(existingUser){
                            alert("Email already registered!");
                            return;
                        }

                        //create a new user
                        let newUser= {
                            id:Date.now(),
                            name:name,
                            email:email,
                            role:role,
                            password:password
                        };

                        users.push(newUser);

                        //save users in local storage

                        localStorage.setItem("users",JSON.stringify(users));

                        alert("Registration Successfully!");

                        window.location.href="login.html";
            });
        </script>

    </body>

</html>
